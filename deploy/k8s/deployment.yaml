apiVersion: apps/v1
kind: Deployment
metadata:
  name: allinscrum
spec:
  # Genau EIN Pod: Laufende Runden leben im Arbeitsspeicher dieses Prozesses. Mehr Replikate würden
  # Tische auf verschiedene Pods verteilen – Spieler säßen dann an unterschiedlichen Tischen.
  replicas: 1
  # Kein RollingUpdate: Alte und neue Version würden kurz parallel laufen, Sessions aufteilen und
  # beide in dieselbe Datei schreiben. Die Tische selbst überstehen das Deploy im Volume.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # Benutzer "node" aus dem Image
        runAsGroup: 1000
        fsGroup: 1000 # damit das Daten-Volume für den Benutzer "node" beschreibbar ist
        seccompProfile:
          type: RuntimeDefault
      # Der Server beendet Socket.IO bei SIGTERM sauber, sichert die Tische und wartet nicht auf Clients.
      terminationGracePeriodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: allinscrum-data
      containers:
        - name: allinscrum
          image: allinscrum
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 41400
              protocol: TCP
          env:
            - name: PORT
              value: '41400'
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          envFrom:
            - configMapRef:
                name: allinscrum
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          # Geschrieben wird nur ins Daten-Volume – sonst braucht der Container weder Schreibrechte
          # noch Privilegien.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
