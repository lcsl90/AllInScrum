{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
# ReadWriteOnce genügt: Es gibt genau einen Pod, der schreibt.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "allinscrum.claimName" . }}
  namespace: {{ include "allinscrum.namespace" . }}
  labels:
    {{- include "allinscrum.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  {{- /* "-" erzwingt storageClassName: "" – kein dynamisches Provisioning, nur vorhandene PVs. */}}
  storageClassName: {{ eq . "-" | ternary "" . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
