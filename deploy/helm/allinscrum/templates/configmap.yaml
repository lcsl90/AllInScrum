apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "allinscrum.fullname" . }}
  labels:
    {{- include "allinscrum.labels" . | nindent 4 }}
data:
  {{- /* Hinter dem Ingress kommt die echte Client-Adresse nur über X-Forwarded-For an – ohne
         Ingress darf dem Header niemand trauen. */}}
  {{- $config := merge (dict) .Values.config (dict "TRUST_PROXY" .Values.ingress.enabled) }}
  {{- range $name, $value := $config }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
